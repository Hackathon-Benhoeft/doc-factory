# Verificação automática a cada envio (push) e pull request:
#   backend  → lint (ruff) + todos os testes (pytest), com Tesseract em português
#   frontend → lint (eslint) + testes (node:test) + build de produção (pega erro de import/sintaxe)
# Commit com ❌ = algo quebrou; clique em "Details" para ver o que foi.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Tesseract (português)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por fonts-dejavu-core
      - name: Dependências
        run: pip install -r requirements.txt ruff
      - name: Lint (erros reais, não estilo)
        run: ruff check app tests --select E9,F63,F7,F82,F401,F811,B904
      - name: Testes
        env:
          LLM_PROVIDER: nenhum
        run: pytest -q
      - name: Acerto contra gabarito (lote de terceiros, só regras)
        # o PDF não é versionado (*.pdf no .gitignore): gera o lote sintético e o gabarito na hora
        run: |
          python scripts/gerar_lote_bernhoeft.py lote_terceiros.pdf
          python scripts/avaliar_acerto.py lote_terceiros.pdf --sem-llm

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
